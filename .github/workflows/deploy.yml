name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: europe-west1
  IMAGE_NAME: gcp-data-pipeline
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff black mypy

      - name: Run ruff
        run: ruff check .

      - name: Check formatting
        run: black --check .

  build-and-deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2.1.8
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.4

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/$GCP_PROJECT_ID/$IMAGE_NAME:${{ github.sha }} \
            -t gcr.io/$GCP_PROJECT_ID/$IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push gcr.io/$GCP_PROJECT_ID/$IMAGE_NAME:${{ github.sha }}
          docker push gcr.io/$GCP_PROJECT_ID/$IMAGE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $IMAGE_NAME \
            --image gcr.io/$GCP_PROJECT_ID/$IMAGE_NAME:latest \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars GCP_PROJECT_ID=$GCP_PROJECT_ID \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 10 \
            --min-instances 0

      - name: Notify deployment
        run: |
          echo "✅ Deployed $IMAGE_NAME to Cloud Run in $GCP_REGION"
          echo "Image: gcr.io/$GCP_PROJECT_ID/$IMAGE_NAME:${{ github.sha }}"
